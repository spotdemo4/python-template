[project]
name = "spotdemo4.python-template"
version = "0.3.1"
description = "python template"
readme = "README.md"
authors = [{ name = "spotdemo4", email = "me@trev.xyz" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
spotdemo4-python-template = "spotdemo4.python_template:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spotdemo4.python_template"

[[tool.uv.index]]
name = "forgejo"
url = "https://trev.zip/api/packages/template/pypi"
publish-url = "https://trev.zip/api/packages/template/pypi"
explicit = true

[tool.basedpyright]
typeCheckingMode = "recommended"
failOnWarnings = true
