[project]
name = "python-template"
version = "1.2.0"
description = "python template"
readme = "README.md"
authors = [{ name = "spotdemo4", email = "me@trev.xyz" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
python-template = "python_template:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "python_template"

[[tool.uv.index]]
name = "forgejo"
url = "https://trev.zip/api/packages/template/pypi"
publish-url = "https://trev.zip/api/packages/template/pypi"
explicit = true

[tool.basedpyright]
typeCheckingMode = "recommended"
failOnWarnings = true

[dependency-groups]
dev = ["basedpyright>=1.39.9", "ruff>=0.16.0"]
