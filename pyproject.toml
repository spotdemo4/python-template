[project]
name = "python-template"
version = "1.5.1"
description = "python template"
readme = "README.md"
authors = [{ name = "spotdemo4", email = "me@trev.xyz" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
python-template = "python_template:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "python_template"

[tool.pyright]
typeCheckingMode = "strict"
